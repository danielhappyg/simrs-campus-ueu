# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: simrs-campus-ueu-demo
    runtime: docker
    plan: free
    region: singapore
    branch: codex/render-supabase-demo
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: SIMRS Campus UEU Demo
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://simrs-campus-ueu-demo.onrender.com
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: id_ID
      - key: APP_MODE
        value: SIMULATION
      - key: APP_SYNTHETIC_ONLY
        value: "true"
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SCHEMA
        value: laravel
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: MAIL_MAILER
        value: log
      - key: PORT
        value: "10000"
