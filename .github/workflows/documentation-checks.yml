name: Documentation checks

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'routes/**'
      - 'scripts/**'
      - 'tests/Documentation/**'
      - '.github/workflows/documentation-checks.yml'
  push:
    branches:
      - main
      - rebuild/clean-slate
    paths:
      - '**.md'
      - 'docs/**'
      - 'routes/**'
      - 'scripts/**'
      - 'tests/Documentation/**'
      - '.github/workflows/documentation-checks.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate local Markdown links and fenced blocks
        shell: ruby {0}
        run: |
          failures = []
          files = Dir.glob("**/*.md", File::FNM_DOTMATCH).reject do |file|
            file.start_with?("vendor/", "node_modules/", "deliverables/")
          end

          files.each do |file|
            text = File.read(file)
            failures << "#{file}: unbalanced fenced code blocks" if text.scan(/^```/).length.odd?

            text.scan(/\[[^\]]*\]\(([^)]+)\)/).flatten.each do |raw|
              target = raw.strip
              next if target.match?(/\A(?:https?:|mailto:|#)/)

              target = target.split("#", 2).first
              resolved = File.expand_path(target, File.dirname(file))
              failures << "#{file}: missing local link #{target}" unless File.exist?(resolved)
            end
          end

          abort(failures.join("\n")) unless failures.empty?
          puts "Validated #{files.length} Markdown files"

      - name: Test all proportional G0 governance v2 planning and adoption contracts
        shell: ruby -Itests {0}
        run: |
          required = %w[
            tests/Documentation/G0GovernanceV2AdoptionDecisionDraftTest.rb
            tests/Documentation/G0GovernanceV2AdoptionDecisionTest.rb
            tests/Documentation/G0GovernanceV2ArchitectureDecisionTest.rb
            tests/Documentation/G0GovernanceV2ImplementationBlueprintTest.rb
            tests/Documentation/G0GovernanceV2IndependentReviewTest.rb
            tests/Documentation/G0ProportionalGovernanceV2ProposalTest.rb
            tests/Documentation/G0ProportionalGovernanceV2ValidatorTest.rb
          ]
          actual = Dir["tests/Documentation/G0*V2*Test.rb"].sort
          abort("Governance v2 planning-test set drifted: #{actual.inspect}") unless actual == required
          actual.each { |file| require File.expand_path(file) }

      - name: Test parity governance validator
        run: ruby tests/Documentation/ParityGovernanceValidatorTest.rb

      - name: Validate parity governance integrity
        run: ruby scripts/validate-parity-governance.rb --mode integrity

      - name: Test owner-governance snapshot generator compatibility
        run: ruby -Itests tests/Documentation/G0OwnerGovernanceSnapshotGeneratorTest.rb

      - name: Test G0/S0 institutional intake compatibility
        run: ruby -Itests tests/Documentation/G0S0IntakeContractTest.rb

      - name: Test current G0-G3 coverage ledger contract
        run: ruby tests/Documentation/G0G3CoverageLedgerTest.rb

      - name: Test Production promotion readiness preflight contract
        run: ruby tests/Documentation/ProductionPromotionReadinessPreflightContractTest.rb

      - name: Test ten-migration cutover control contract
        run: ruby tests/Documentation/TenMigrationCutoverContractTest.rb

      - name: Parse ten-migration SQL with PostgreSQL 17.10
        env:
          SIMRS_TEN_MIGRATION_POSTGRES17: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
        run: ruby tests/Documentation/TenMigrationPostgres17SqlContractTest.rb

      - name: Test local portability execution-source binding
        run: ruby tests/Documentation/LocalPortabilityFullSuiteHarnessContractTest.rb

      - name: Test disposable PostgreSQL shared-state harness contract
        run: ruby tests/Documentation/LocalPostgresSharedStateHarnessContractTest.rb

      - name: Test hosted Structured RJ/RM UAT protocol contract
        run: ruby tests/Documentation/HostedStructuredRjRmUatProtocolTest.rb

      - name: Test temporary teaching-role access runbook contract
        run: ruby tests/Documentation/TeachingRoleAccessRunbookTest.rb

      - name: Test historical workflow artifact boundary
        run: ruby tests/Documentation/HistoricalWorkflowArtifactBoundaryTest.rb
