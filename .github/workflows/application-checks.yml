name: Application checks

on:
  pull_request:
  push:
    branches:
      - main
      - rebuild/clean-slate

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP, React, and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reject tracked credential files
        shell: ruby {0}
        run: |
          tracked = `git ls-files`.lines.map(&:strip)
          forbidden_names = [".env", "pkcs11.txt"]
          forbidden_extensions = [".key", ".pem", ".p12", ".pfx"]

          rejected = tracked.select do |path|
            basename = File.basename(path)
            forbidden_names.include?(basename) ||
              basename.start_with?(".env.") && basename != ".env.example" ||
              forbidden_extensions.include?(File.extname(path))
          end

          abort("Forbidden credential-like files are tracked:\n#{rejected.join("\n")}") unless rejected.empty?
          puts "No forbidden credential files are tracked"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Validate dependency manifests
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Check PHP formatting
        run: composer lint:check

      - name: Analyze PHP types
        run: composer types:check

      - name: Run PHP tests
        run: php artisan test

      - name: Generate frontend route bindings
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint:check

      - name: Check TypeScript
        run: npm run types:check

      - name: Run React unit and accessibility tests
        run: npm run test:unit

      - name: Build production assets
        run: npm run build

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  # Supabase PostgreSQL is the supported hosted database; keep integration
  # coverage aligned with its private laravel schema.
  postgres-integration:
    name: PostgreSQL 17 laravel-schema integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: SIMULATION
      APP_SYNTHETIC_ONLY: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: simrs_test
      DB_USERNAME: postgres
      DB_PASSWORD: local-ci-password
      DB_SCHEMA: laravel
      DB_SSLMODE: disable
      PGPASSWORD: local-ci-password
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: simrs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d simrs_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_pgsql
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare migration environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create private application schema
        run: >-
          psql --host=127.0.0.1 --username=postgres --dbname=simrs_test
          --set=ON_ERROR_STOP=1 --command='CREATE SCHEMA IF NOT EXISTS laravel;'

      - name: Apply migrations to PostgreSQL laravel schema
        run: php artisan migrate:fresh --force

      - name: Assert sentinel tables are isolated to laravel schema
        shell: bash
        run: |
          LARAVEL_SENTINELS="$(psql --host=127.0.0.1 --username=postgres --dbname=simrs_test --tuples-only --no-align --command="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'laravel' AND table_name IN ('migrations', 'users', 'patients');")"
          PUBLIC_SENTINELS="$(psql --host=127.0.0.1 --username=postgres --dbname=simrs_test --tuples-only --no-align --command="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('migrations', 'users', 'patients');")"
          test "${LARAVEL_SENTINELS}" = "3"
          test "${PUBLIC_SENTINELS}" = "0"

      # RefreshDatabase starts each PHPUnit process with its own migrate:fresh.
      # Give it an empty disposable schema so Laravel's multi-table DROP does
      # not correctly trip the application SQL guards installed at boot.
      - name: Recreate private schema for test-managed migrations
        run: >-
          psql --host=127.0.0.1 --username=postgres --dbname=simrs_test
          --set=ON_ERROR_STOP=1
          --command='DROP SCHEMA IF EXISTS laravel CASCADE; CREATE SCHEMA laravel;'

      - name: Run backend suite on PostgreSQL laravel schema
        run: php artisan test

  release-candidate:
    name: Build release candidate (no deploy)
    needs:
      - quality
      - postgres-integration
    # Build release artifacts only for the canonical mainline; PRs retain all quality and integration gates.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Verify the build did not modify tracked source
        # public/build is the output of the Linux build performed above and is
        # intentionally assembled into the release candidate from this working
        # tree. Keep the guard focused on source and other tracked inputs.
        run: git diff --exit-code -- . ':(exclude)public/build'

      - name: Generate and assemble the release candidate
        id: release
        shell: bash
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          RELEASE_NAME="simrs-campus-ueu-${RELEASE_COMMIT}"
          php artisan ops:release-manifest release-manifest.json --commit="${RELEASE_COMMIT}"
          php artisan ops:assemble-release release-manifest.json storage/app/release-candidate
          test -f storage/app/release-candidate/vendor/autoload.php
          test -f storage/app/release-candidate/public/build/manifest.json
          test -f storage/app/release-candidate/release-manifest.json
          test ! -e storage/app/release-candidate/.env
          test ! -e storage/app/release-candidate/database/database.sqlite
          test ! -d storage/app/release-candidate/tests
          test ! -d storage/app/release-candidate/node_modules
          COMMIT_TIME="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${COMMIT_TIME}" --owner=0 --group=0 --numeric-owner --format=ustar \
            --create --file="${RELEASE_NAME}.tar" --directory=storage/app release-candidate
          sha256sum "${RELEASE_NAME}.tar" > "${RELEASE_NAME}.tar.sha256"
          php artisan ops:verify-release "${RELEASE_NAME}.tar" "${RELEASE_NAME}.tar.sha256" --build-only
          echo "name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable short-lived release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.name }}
          path: |
            ${{ steps.release.outputs.name }}.tar
            ${{ steps.release.outputs.name }}.tar.sha256
          if-no-files-found: error
          retention-days: 14
