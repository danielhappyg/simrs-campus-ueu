name: Application checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP, React, and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Validate dependency manifests
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Check PHP formatting
        run: composer lint:check

      - name: Analyze PHP types
        run: composer types:check

      - name: Run PHP tests
        run: php artisan test

      - name: Generate frontend route bindings
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint:check

      - name: Check TypeScript
        run: npm run types:check

      - name: Run React unit and accessibility tests
        run: npm run test:unit

      - name: Build production assets
        run: npm run build

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  mysql-integration:
    name: MySQL 8.4 backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: SIMULATION
      APP_SYNTHETIC_ONLY: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: simrs_test
      DB_USERNAME: root
      DB_PASSWORD: local-ci-password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: simrs_test
          MYSQL_ROOT_PASSWORD: local-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_mysql
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare migration environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Apply migrations to MySQL
        run: php artisan migrate:fresh --force

      - name: Run backend suite on MySQL
        run: php artisan test

  release-candidate:
    name: Build release candidate (no deploy)
    needs:
      - quality
      - mysql-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Verify the build did not modify tracked source
        id: verify-frontend-build
        run: git diff --exit-code

      - name: Upload Linux Vite assets when the committed build drifts
        if: failure() && steps.verify-frontend-build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-vite-build
          path: |
            public/build/manifest.json
            public/build/assets/app-*.css
            public/build/assets/app-*.js
          if-no-files-found: error
          retention-days: 3

      - name: Generate and assemble the release candidate
        id: release
        shell: bash
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          RELEASE_NAME="simrs-campus-ueu-${RELEASE_COMMIT}"
          php artisan ops:release-manifest release-manifest.json --commit="${RELEASE_COMMIT}"
          php artisan ops:assemble-release release-manifest.json storage/app/release-candidate
          test -f storage/app/release-candidate/vendor/autoload.php
          test -f storage/app/release-candidate/public/build/manifest.json
          test -f storage/app/release-candidate/release-manifest.json
          test ! -e storage/app/release-candidate/.env
          test ! -e storage/app/release-candidate/database/database.sqlite
          test ! -d storage/app/release-candidate/tests
          test ! -d storage/app/release-candidate/node_modules
          COMMIT_TIME="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${COMMIT_TIME}" --owner=0 --group=0 --numeric-owner --format=ustar \
            --create --file="${RELEASE_NAME}.tar" --directory=storage/app release-candidate
          sha256sum "${RELEASE_NAME}.tar" > "${RELEASE_NAME}.tar.sha256"
          php artisan ops:verify-release "${RELEASE_NAME}.tar" "${RELEASE_NAME}.tar.sha256"
          echo "name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable short-lived release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.name }}
          path: |
            ${{ steps.release.outputs.name }}.tar
            ${{ steps.release.outputs.name }}.tar.sha256
          if-no-files-found: error
          retention-days: 14
